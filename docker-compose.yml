version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_prediction_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - traffic_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: traffic_prediction_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge
